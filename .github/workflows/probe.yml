name: Probe sources

on:
  workflow_dispatch:
    inputs:
      script:
        required: false
        default: probe_sites.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/${{ inputs.script || 'probe_sites.py' }}
      - name: Commit probe report
        run: |
          git config user.name "radarflat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f probe
          git diff --cached --quiet || git commit -m "probe: sources $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
